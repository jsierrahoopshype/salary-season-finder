name: Update Salary Data

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6:00 AM UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build the salary digest and print it without posting"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

env:
  #: The source sheets this repo tracks, committed with every data.json they
  #: built (and on Mondays regardless) so a checkout never lags the data built
  #: from them. The two Cyro sheets are not in this list
  #: because they are not tracked at all, which is why no local run can
  #: reproduce a full build; that is a separate decision.
  SOURCE_FILES: >-
    data_sources/stats.csv
    data_sources/salaries_historical.csv
    data_sources/salaries_future.csv
    data_sources/awards.csv
    data_sources/bio.csv

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download Google Sheets CSVs
        run: |
          mkdir -p data_sources
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          CURL_OPTS="-sL --retry 3 --retry-delay 5 --max-time 300 -H \"User-Agent: $UA\""
          
          echo "Downloading stats..."
          eval curl $CURL_OPTS -o data_sources/stats.csv \
            "\"https://docs.google.com/spreadsheets/d/1ZrDfzqiC31Hu3YCtxT4aZbZF4QVCVyGe6wBytR2LF30/export?format=csv&gid=0\"" \
            || { echo "::error::Google Sheets download failed or timed out: stats.csv"; exit 1; }
          sleep 2
          echo "Downloading historical salaries..."
          eval curl $CURL_OPTS -o data_sources/salaries_historical.csv \
            "\"https://docs.google.com/spreadsheets/d/1ZrDfzqiC31Hu3YCtxT4aZbZF4QVCVyGe6wBytR2LF30/export?format=csv&gid=1151460858\"" \
            || { echo "::error::Google Sheets download failed or timed out: salaries_historical.csv"; exit 1; }
          sleep 2
          echo "Downloading 2025-26 current salaries (Cyro)..."
          eval curl $CURL_OPTS -o data_sources/salaries_2526_current.csv \
            "\"https://docs.google.com/spreadsheets/d/14TQPdQ9mDhHMMMQa5vcs0coL98ZloHORtYElDikKoWY/export?format=csv&gid=1402642613\"" \
            || { echo "::error::Google Sheets download failed or timed out: salaries_2526_current.csv"; exit 1; }
          # Future salaries (2026-27 onwards): the All-Time Database's "Future Salaries"
          # tab is only IMPORTRANGEs of this same Salary tab (columns A, C, K:Z), so it
          # is rebuilt from the copy just downloaded instead of waiting on that sheet.
          echo "Building future salaries from the Salary tab..."
          python scripts/future_salaries_from_salary_tab.py \
            data_sources/salaries_2526_current.csv data_sources/salaries_future.csv \
            || { echo "::error::Could not build salaries_future.csv from salaries_2526_current.csv"; exit 1; }
          sleep 2
          echo "Downloading 2025-26 dead money (Cyro)..."
          eval curl $CURL_OPTS -o data_sources/salaries_2526_dead.csv \
            "\"https://docs.google.com/spreadsheets/d/14TQPdQ9mDhHMMMQa5vcs0coL98ZloHORtYElDikKoWY/export?format=csv&gid=1668033956\"" \
            || { echo "::error::Google Sheets download failed or timed out: salaries_2526_dead.csv"; exit 1; }
          sleep 2
          echo "Downloading awards..."
          eval curl $CURL_OPTS -o data_sources/awards.csv \
            "\"https://docs.google.com/spreadsheets/d/1ZrDfzqiC31Hu3YCtxT4aZbZF4QVCVyGe6wBytR2LF30/export?format=csv&gid=1456513900\"" \
            || { echo "::error::Google Sheets download failed or timed out: awards.csv"; exit 1; }
          sleep 2
          echo "Downloading bio..."
          eval curl $CURL_OPTS -o data_sources/bio.csv \
            "\"https://docs.google.com/spreadsheets/d/1ZrDfzqiC31Hu3YCtxT4aZbZF4QVCVyGe6wBytR2LF30/export?format=csv&gid=1488063724\"" \
            || { echo "::error::Google Sheets download failed or timed out: bio.csv"; exit 1; }
          echo "Download complete. File sizes:"
          wc -c data_sources/*.csv

      - name: Validate downloads
        run: |
          # Google can answer a slow export with an error page instead of the CSV,
          # and an error page passes a plain line count. On Oct 27, 2026 one did:
          # the build read no historical salaries, no stats and no bios, and the
          # digest posted false "no longer on the books" items. So each file must
          # look like a CSV, and a sheet with a copy committed in data_sources/
          # must keep its header and at least 90% of that copy's lines.
          for f in data_sources/stats.csv data_sources/salaries_historical.csv data_sources/salaries_2526_current.csv data_sources/salaries_2526_dead.csv data_sources/awards.csv data_sources/bio.csv; do
            if [ ! -s "$f" ]; then
              echo "::error::$f is empty or missing"
              exit 1
            fi
            lines=$(wc -l < "$f")
            echo "$f: $lines lines"
            if [ "$lines" -lt 10 ]; then
              echo "::error::$f has too few lines, download may have failed"
              exit 1
            fi
            if head -c 200 "$f" | grep -qi '<html\|<!doctype'; then
              echo "::error::$f is a web page, not a CSV (Google sent an error page)"
              exit 1
            fi
            if git cat-file -e "HEAD:$f" 2>/dev/null; then
              old_lines=$(git show "HEAD:$f" | wc -l)
              old_head=$(git show "HEAD:$f" | head -1 | cut -c1-40)
              new_head=$(head -1 "$f" | cut -c1-40)
              if [ "$new_head" != "$old_head" ]; then
                echo "::error::$f header changed from '$old_head' to '$new_head'"
                exit 1
              fi
              if [ $((lines * 10)) -lt $((old_lines * 9)) ]; then
                echo "::error::$f shrank from $old_lines to $lines lines"
                exit 1
              fi
            fi
          done
          echo "All CSV files validated."

      - name: Build data.json
        run: python build_data.py --local

      - name: Check for changes
        id: check_changes
        run: |
          # The source sheets count as a change of their own. A pull that
          # moves only rows data.json has no salary for would otherwise leave
          # the committed copies behind again, which is what this guards.
          # reports/ too: the tab's duplicate rows can be deleted without
          # data.json moving, since the build already reads them once, and the
          # list of them would otherwise go stale.
          if git diff --quiet data/data.json $SOURCE_FILES 2>/dev/null \
             && [ -z "$(git status --porcelain reports/)" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes detected in data.json or the source sheets"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changes detected in data.json or the source sheets"
            new_size=$(wc -c < data/data.json)
            echo "New file size: $new_size bytes"
          fi

      - name: Commit and push
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # The report build_data.py writes beside the data, so the two never
          # describe different days.
          git add data/data.json data/team_corrections_report.json \
            data/salary_sources_report.json reports/
          # Stamped with the same build time as data.json; Salary Ladder reads
          # the two together. Added on its own line so that a build which did
          # not write it can never keep data.json from being committed.
          if [ -f data/roster_status.json ]; then
            git add data/roster_status.json
          fi

          # The source sheets go in whenever data.json does, and on Mondays
          # regardless. A checkout holding older copies than data.json means
          # anything recomputed locally silently disagrees with what is
          # published: they sat five weeks behind on 2026-10-04, where 498
          # records of a finished 2025-26 read 72 games against the stats
          # file's 54. The tests hold the committed stats sheet to the data
          # (test_the_stats_sheet_covers_every_season_the_data_has_stats_for
          # and _is_never_behind_the_data_inside_a_season), and the page job
          # runs them before it commits. A weekly-only rule broke that: on
          # 2026-10-25 the data took the first 2026-27 games, the sheet on file
          # had none, and no page was committed again until a person rebuilt
          # them. During the season data.json moves every day, so the sheets
          # do too; stats.csv is 5 MB but only the current season's rows move,
          # and git stores each day as a small delta. A day when only a sheet
          # moved, in rows data.json does not use, still waits for Monday.
          if ! git diff --cached --quiet data/data.json; then
            echo "data.json moved: the source sheets that built it go in with it"
            git add $SOURCE_FILES
          elif [ "$(date -u +%u)" = "1" ]; then
            echo "Monday: the source sheets go in"
            git add $SOURCE_FILES
          else
            echo "data.json unchanged and not Monday: the sheets stay as last committed"
            git checkout -- $SOURCE_FILES 2>/dev/null || true
          fi
          # A pull that moved only a source sheet on a day that is not Monday
          # leaves nothing staged, and "git commit" on an empty index fails the
          # step. Nothing to say is not a failure.
          if git diff --cached --quiet; then
            echo "Nothing staged: the data is unchanged and the sheets wait for Monday"
            exit 0
          fi
          git commit -m "Auto-update salary data [$(date -u +%Y-%m-%d)]"
          git push

  # Factoids are built in a separate job that starts only after update-data has
  # finished and pushed. Nothing here can delay, fail or roll back the data.json
  # commit: it is already on the branch before this job checks out. The job is
  # also continue-on-error, so a red factoid build never reds the workflow.
  build-factoids:
    needs: update-data
    if: always() && needs.update-data.result == 'success'
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout the branch as update-data left it
        uses: actions/checkout@v4
        with:
          # Not the SHA that triggered the run: update-data pushed the new
          # data.json after that, and this job has to build from it.
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: pip install pytest

      - name: Run factoid tests
        run: python -m pytest scripts/tests/test_factoids.py -q

      - name: Build factoids.json
        run: python scripts/build_factoids.py

      - name: Commit and push factoids
        run: |
          if git diff --quiet data/factoids.json 2>/dev/null; then
            echo "No changes in factoids.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/factoids.json
          git commit -m "Auto-update factoids [$(date -u +%Y-%m-%d)]"
          # update-data pushed moments ago; rebase rather than race it
          for attempt in 1 2 3; do
            # --autostash so a file this job did not stage cannot stop the
            # rebase, and with it the push, the way it did once already.
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" \
              && git push && exit 0
            echo "push attempt $attempt failed, retrying"
            sleep $((attempt * 5))
          done
          echo "could not push factoids.json; data.json is unaffected"
          exit 1

  # The pages are prerendered in a third job, after the factoids are on the
  # branch. Same guarantee as build-factoids: data.json was committed and
  # pushed two jobs ago, this job only ever adds its own files, and
  # continue-on-error keeps a red prerender from reding the workflow or
  # touching the data commit.
  prerender-pages:
    needs: [update-data, build-factoids]
    if: always() && needs.update-data.result == 'success'
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout the branch as the two jobs before left it
        uses: actions/checkout@v4
        with:
          # Same reason as build-factoids: the data and the factoids this job
          # renders were pushed after the run started.
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install test dependencies
        run: pip install pytest

      - name: Build the pages
        run: python scripts/prerender_pages.py

      - name: Run prerender tests
        run: python -m pytest scripts/tests/test_prerender.py -q

      - name: Commit and push pages
        run: |
          # No "set -e" here: the retry loop below ends in a && chain whose
          # failure is the thing it retries, and -e would exit on the first
          # attempt instead. The one command that must not fail quietly is
          # checked by hand.
          # Every path the prerender writes, read from the config it builds
          # from rather than kept by hand here. A family left off this list is
          # not merely left uncommitted: its files stay unstaged, and the
          # "git pull --rebase" below then refuses to run, so the push fails
          # and no page lands at all. That is how region, pick-range and
          # college-position stopped the daily pages on 2026-10-03, leaving 700
          # of them a build behind, and how the four never-* families went
          # uncommitted from the day they were added.
          if ! PAGE_PATHS_RAW="$(python scripts/page_paths.py)"; then
            echo "::error::scripts/page_paths.py failed; refusing to stage a partial list"
            exit 1
          fi
          mapfile -t PAGE_PATHS <<< "$PAGE_PATHS_RAW"
          if [ "${#PAGE_PATHS[@]}" -lt 25 ]; then
            echo "::error::page_paths.py returned ${#PAGE_PATHS[@]} paths, far too few"
            exit 1
          fi
          printf '    %s\n' "${PAGE_PATHS[@]}"
          git add -A "${PAGE_PATHS[@]}"
          if git diff --cached --quiet; then
            echo "No page changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Auto-update entity pages [$(date -u +%Y-%m-%d)]"
          # the two jobs before this one pushed; rebase rather than race them
          for attempt in 1 2 3; do
            # --autostash so a file this job did not stage cannot stop the
            # rebase, and with it the push, the way it did once already.
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" \
              && git push && exit 0
            echo "push attempt $attempt failed, retrying"
            sleep $((attempt * 5))
          done
          echo "could not push the pages; data.json is unaffected"
          exit 1

  # The digest reads the data.json update-data pushed, the factoids
  # build-factoids pushed and the slugs prerender-pages pushed, so it runs last
  # of the four and never races any of them for the branch. Same guarantee as the two jobs
  # before it: the data commit is already on the branch, this job only ever
  # writes data/digest_state.json, and continue-on-error keeps a Slack problem
  # from reding the workflow. The state file is what stops a rerun posting the
  # same day twice: it names the build the last digest read, and a rerun that
  # finds nothing new posts "none today" instead.
  salary-digest:
    needs: [update-data, build-factoids, prerender-pages]
    if: always() && needs.update-data.result == 'success'
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout the branch as the jobs before left it
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          # the digest reads yesterday's data.json out of the history
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build the digest
        env:
          SLACK_SIGNINGS_WEBHOOK: ${{ secrets.SLACK_SIGNINGS_WEBHOOK }}
          # Through env rather than interpolated into the script. A workflow
          # input is outside content: pasted into the shell it is one quote away
          # from running as a command, and nothing about this one being a
          # checkbox today keeps it one.
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail
          dry=""
          if [ "$DRY_RUN" = "true" ]; then
            dry="--dry-run"
          fi
          {
            echo "# Salary digest"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          python scripts/salary_digest.py $dry --summary "$GITHUB_STEP_SUMMARY"

      - name: Commit the state file
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          if git diff --quiet data/digest_state.json 2>/dev/null; then
            echo "No change in data/digest_state.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/digest_state.json
          git commit -m "Record the build the salary digest read [$(date -u +%Y-%m-%d)]"
          # three jobs pushed before this one; rebase rather than race them
          for attempt in 1 2 3; do
            # --autostash so a file this job did not stage cannot stop the
            # rebase, and with it the push, the way it did once already.
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" \
              && git push && exit 0
            echo "push attempt $attempt failed, retrying"
            sleep $((attempt * 5))
          done
          echo "could not push the state file; the next run will compare from the same place"
          exit 1
